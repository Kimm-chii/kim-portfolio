<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KIM キム — Creative Web Studio</title>

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var supportDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && supportDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>

    <!-- SEO and Social Sharing Metadata -->
    <meta name="description" content="Exploring modern web experiences through thoughtful design, responsive interfaces, and frontend exploration." />
    
    <!-- Open Graph / Facebook -->
